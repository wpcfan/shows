# 新角色模板 — 复制到 characters/<id>/character.yaml 后填写
# 用 GenerateImage 生成 reference.png 放到同目录

id: <character-id>                  # 必须与目录名一致
name_cn: <中文名>
name_en: <English Name>
description_cn: |
  <中文人设描述,供人读>
appearance_en: >-                    # 给 Seedance 的英文外观关键词,build-prompt.js 在引用此角色时注入
  <English appearance keywords>
role: <protagonist|supporting|walker-archetype|twist|extra>
appears_in: []                       # 集数列表,如 [S01E01]
prompt_inject: true                  # true 则 build-prompt.js 在引用此角色的 shot 里注入 appearance_en
