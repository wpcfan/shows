# S01E01 — 第一视角 / POV
# 第一视角主角穿越废弃城市,屠戮丧尸、躲避追逐,全程不露脸。
# 结尾镜中映出丧尸脸——主角也是丧尸?

episode: S01E01
title: 第一视角 / POV
logline_cn: 第一视角主角穿越废弃城市,屠戮丧尸、躲避追逐,全程不露脸。结尾镜中映出丧尸脸——主角也是丧尸?
style_preset: walking-dead

defaults:
  ratio: "16:9"
  resolution: 720p
  duration: 8

scenes:
  # ============ 场景 1:阳光沙滩 (shot 1) ============
  - id: s01
    location: beach-sunny
    time_cn: 上午
    weather_cn: 晴
    shots:
      - id: s01-shot-01
        duration: 10
        no_style_inject: true
        description_cn: |
          主角躺在沙滩椅上,脚朝向大海,头朝向陆地,脸朝上。
          慢慢睁开眼,看到蓝天和刺眼的太阳(仰视)。眨眼适应光线。海鸥飞过蓝天。
          主角坐起来(手短暂撑椅子后离开画面),视角从天空转向前方的大海。
          沙滩上一排脚印延伸向海水。蓝蓝的海,白色浪花卷来。
          一只小螃蟹飞快爬到主角脚下,把自己飞快埋入沙子。
        prompt_en: >-
          Cinematic first-person POV, not a video game. Protagonist lying on
          a beach lounge chair, feet toward the ocean, head toward land, face
          looking up. Eyes slowly open, seeing bright blue sky and dazzling
          sunlight overhead (looking up). Eyes squeeze shut against the
          glare, then open again. A seagull glides across the blue sky. POV
          sits up from the lounge chair — hands briefly brace the chair then
          leave frame — as the camera tilts up from the sky to reveal the
          ocean ahead. A line of footprints trails across the white sand
          toward the water. Bright blue ocean with white foamy waves rolling
          in. A small crab scurries quickly across the sand to the
          protagonist's feet and buries itself rapidly into the sand.
        camera: cinematic, smooth camera movement, shallow depth of field, warm golden sunlight, natural lighting
        characters: []
        location: beach-sunny

  # ============ 场景 1b:废弃医院 (保留,后续重拍) ============
  - id: s01b
    location: abandoned-hospital
    time_cn: 清晨
    weather_cn: 阴天
    shots:
      - id: s01b-shot-02
        duration: 10
        description_cn: |
          POV 缓缓站起,向前走入满地碎物的医院走廊。翻倒的轮椅、污浊的输液架、裂开的地砖。
          远处传来低沉喉音呻吟,在空荡走廊回响。手伸出去推开一扇病房门。
        prompt_en: >-
          First-person POV. Slowly standing up, walking forward down a
          debris-filled hospital corridor. Overturned wheelchair, dirty IV
          stands, cracked floor tiles. Distant low guttural moan echoing
          through empty corridor. Hand reaches out and pushes open a ward
          door.
        camera: tracking shot forward, slow, eerie
        characters: [protagonist-hands]
        location: abandoned-hospital

      - id: s01b-shot-03
        duration: 10
        description_cn: |
          POV 转过走廊拐角,见一名新感染丧尸(穿病号服背对镜头,身体摇晃)。
          POV 举起铁棍,落下时切镜(暗示击杀,不直接呈现)。
        prompt_en: >-
          First-person POV. Slowly rounding a corner in the dim hospital
          corridor. A lone figure in a tattered hospital gown stands far down
          the hallway, back to camera, swaying slightly. POV holds still at a
          distance, observing quietly. The figure remains motionless. Long
          silent moment. Scene fades.
        camera: handheld, slight shake, abrupt cut on impact
        characters: [protagonist-hands, walker-fresh]
        location: abandoned-hospital

  # ============ 场景 2:城市街道 (shots 4-5) ============
  - id: s02
    location: city-street-overcast
    time_cn: 上午
    weather_cn: 阴天
    shots:
      - id: s02-shot-04
        duration: 8
        description_cn: |
          POV 推开医院大门走到城市街道。阴天,废弃车辆横七竖八,纸张在风中飘飞。
          手握铁棍处于画面下方,金属上有暗色污渍。
        prompt_en: >-
          First-person POV. Pushing open hospital entrance doors, stepping
          out onto a city street under overcast sky. Abandoned vehicles
          scattered across lanes, papers blowing in wind. Hand grips a steel
          crowbar at lower frame, dark stains visible on the metal surface.
        camera: handheld, slight shake, establishing wide
        characters: [protagonist-hands]
        location: city-street-overcast

      - id: s02-shot-05
        duration: 12
        description_cn: |
          多个丧尸转头发现 POV,POV 立即狂奔。手持剧烈晃动,穿梭废弃车辆。
          丧尸手臂从两侧伸向镜头。
        prompt_en: >-
          First-person POV. Multiple walkers turn their heads toward camera,
          noticing. POV breaks into a sprint, intense handheld camera shake,
          fast pace. Weaving between abandoned vehicles on the street. Walker
          arms reaching toward camera from both sides as POV passes.
        camera: intense handheld shake, fast pace, sprinting
        characters: [walker-decayed, walker-fresh]
        location: city-street-overcast

  # ============ 场景 3:沿街店面 (shot 6) ============
  - id: s03
    location: storefront-dusk
    time_cn: 黄昏
    weather_cn: 阴天
    shots:
      - id: s03-shot-06
        duration: 10
        description_cn: |
          POV 闯入沿街店面摔上玻璃门,丧尸在外捶打,手掌贴在玻璃上。
          POV 退入阴影角落,胸口剧烈起伏喘气。手扎头巾遮住下半张脸。
        prompt_en: >-
          First-person POV. Bursting into a looted storefront, pulling the
          glass door shut. Outside, silhouettes move slowly past the dim
          glass. POV backs into a dark corner, heavy breathing visible in
          chest heave. Hand ties a bandana over the lower face.
        camera: handheld, frantic then settling, low light
        characters: [protagonist-hands]
        location: storefront-dusk

  # ============ 场景 4:黄昏小巷 (shot 7) ============
  - id: s04
    location: alley-dusk
    time_cn: 黄昏
    weather_cn: 晴
    shots:
      - id: s04-shot-07
        duration: 10
        description_cn: |
          POV 在窄巷翻越铁丝网围栏。手抓铁丝,丧尸从下方伸手抓脚。
          POV 踢开一只丧尸,继续向顶部翻越。
        prompt_en: >-
          First-person POV. Climbing a chain-link fence in a narrow alley at
          dusk. Hands gripping the wire. Below, distant silhouettes gather
          slowly at the base of the fence. POV climbs faster, clearing the
          top of the fence and dropping to the other side.
        camera: handheld, looking down then up, tense
        characters: [protagonist-hands, walker-decayed]
        location: alley-dusk

  # ============ 场景 5:夜间停车场 (shot 8) ============
  - id: s05
    location: parking-garage-night
    time_cn: 夜间
    weather_cn: 无
    shots:
      - id: s05-shot-08
        duration: 10
        description_cn: |
          POV 在地下停车场潜行。灯光闪烁,空气湿冷。前方丧尸背对镜头。
          POV 从背后接近,双手从后方环住丧尸头部,快速扭动,丧尸倒地。
        prompt_en: >-
          First-person POV. Stalking silently through an underground parking
          garage at night. Flickering dim lights, cold damp air. A lone figure
          stands ahead in the shadows, back to camera, motionless. POV creeps
          closer, holding breath. The figure does not move. Long tense moment.
          Scene fades.
        camera: handheld, slow stalking then quick motion, low light
        characters: [protagonist-hands, walker-decayed]
        location: parking-garage-night

  # ============ 场景 6:便利店外 — 反转 (shots 9-10) ============
  - id: s06
    location: storefront-dusk
    time_cn: 黄昏
    weather_cn: 阴天
    shots:
      - id: s06-shot-09
        duration: 8
        description_cn: |
          POV 走向废弃便利店,玻璃门完好但落满灰尘。随着 POV 逼近,
          玻璃上的倒影逐渐清晰——一个模糊人形轮廓开始浮现。
        prompt_en: >-
          First-person POV. Walking toward an abandoned convenience store at
          dusk. The glass door is intact but dust-covered. As POV approaches
          slowly, a reflection in the glass gradually clarifies — a vague
          silhouette starts to form on the dusty surface.
        camera: slow push-in, eerie, building tension
        characters: [protagonist-hands]
        location: storefront-dusk

      - id: s06-shot-10
        duration: 10
        description_cn: |
          反转:玻璃倒影完全清晰——映出的不是主角,而是一张腐败丧尸脸
          (灰白皮肤、浑浊瞳孔、凹陷颧骨)。主角一直是丧尸。
          POV 的手抬起来,缓缓触碰玻璃里那张脸。切黑。出字幕卡。
        prompt_en: >-
          First-person POV. Standing before the convenience store glass door.
          The reflection clarifies fully — revealing a gaunt weathered face
          with milky clouded eyes where the protagonist's reflection should
          be. Grey-white desaturated skin, sunken cheek. The protagonist's
          scarred hand reaches up and slowly touches the glass, mirroring the
          reflection's face. Scene fades to darkness. Title card fades in.
        camera: slow, eerie, lingering then abrupt cut to black
        characters: [protagonist-hands, protagonist-zombie-face]
        location: storefront-dusk
